server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Редиректы — относительным Location: за kamal-proxy nginx видит http,
    # абсолютный URL увёл бы клиента на http://mm-prom.ru.
    absolute_redirect off;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-index.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 301-карта дублей WordPress (актуально для старых ссылок из рекламы и поиска).
    # $is_args$args сохраняет utm_*, yclid и etext при переходе.
    location = /garage/ {
        return 301 /atlas-garazhnyj/$is_args$args;
    }
    location = /garage {
        return 301 /atlas-garazhnyj/$is_args$args;
    }
    location = /ga/ {
        return 301 /atlas-garazhnyj/$is_args$args;
    }
    location = /ga {
        return 301 /atlas-garazhnyj/$is_args$args;
    }
    location = /vitebski/ {
        return 301 /avrora-vitebskij/$is_args$args;
    }
    location = /vitebski {
        return 301 /avrora-vitebskij/$is_args$args;
    }
    location = /avrora-vitebskij-3/ {
        return 301 /avrora-vitebskij/$is_args$args;
    }
    location = /avrora-vitebskij-3 {
        return 301 /avrora-vitebskij/$is_args$args;
    }
    location = /sitemap.html {
        return 301 /$is_args$args;
    }

    location ~ /\.ht {
        return 404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2|png|jpe?g|webp|avif|svg|ico|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 80;
    server_name www.mm-prom.ru;
    return 301 https://mm-prom.ru$request_uri;
}
