# Staging ММ Пром на VPS tessa (kamal-proxy, TLS Let's Encrypt).
# Сборка: npm run build с ASTRO_SITE=https://test.mm-prom.ru MMPROM_ENV=staging.
# Деплой: ../../tessa-infra/kamal deploy -c deploy/kamal/deploy.yml
# DNS: A test.mm-prom.ru -> 139.100.238.81 (до деплоя не обязательна, но без неё
# kamal-proxy не выпустит сертификат).

service: mm-prom-staging
image: buro/mm-prom-staging

registry:
  server: cr.selcloud.ru
  username: [KAMAL_REGISTRY_USER]
  password: [KAMAL_REGISTRY_PASSWORD]

builder:
  arch: amd64
  context: .
  dockerfile: deploy/kamal/Dockerfile

ssh:
  user: deploy

servers:
  web:
    - 139.100.238.81

proxy:
  host: test.mm-prom.ru
  ssl: true
  app_port: 80
  healthcheck:
    path: /
    interval: 3
    timeout: 5

deploy_timeout: 120
secrets_path: deploy/kamal/secrets
