<!-- ═══════════════════════════════════════════════════════════════════════
     Канонический <head> и базовый CSS макетов П-6 «Новый сайт» (ММПром)
     Файл: Прототипы/_head.html
     Воркер вставляет содержимое этого файла в <head> КАЖДОГО макета
     дословно, без изменений. Правка канона = правка этого файла +
     DESIGN.md + _worker_prompt.md и перегенерация затронутых страниц.

     Бренд (утв. 2026-08): логотип assets/mmprom-logo.png;
     акценты #3D0E6A (фиолетовый) и #EBB81E (жёлтый); база — белый/чёрный.
     Шрифт Averta CY (лицензионный, в макетах не подключается) →
     фолбэк Manrope → Inter → системные. Аудитория консервативная:
     акценты дозированно, без «кричащих» сочетаний.
     ═══════════════════════════════════════════════════════════════════════ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Шрифты: Manrope (фолбэк Averta CY) + Inter; Material Symbols для иконок.
     Офлайн макеты работают с деградацией на системные шрифты и текст. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ─── Канон брейкпоинтов (mobile-first, UX §3 дефолт) ──────────────────
   Базовые стили = смартфон (360–767px).
   @media (min-width: 768px)  → планшет (768–1023px).
   @media (min-width: 1024px) → десктоп (≥1024px).
   Контрольная ширина дизайна — 1366px.
   Шапка: <1024 — бургер + оверлей меню; ≥1024 — полное горизонтальное меню.
   CTA шапки скрыт <768. Touch-target ≥ 44px. Фиксированные ширины >480px
   вне :root запрещены. Каждая страница: ≥ 2 media query (768 и 1024).
   Мысленный тест: «360px — без горизонтального скролла». */
:root{
  /* Брендовые токены (утв. 2026-08) */
  --color-primary:#3D0E6A;        /* фиолетовый — ТОЛЬКО акценты: кнопки, ссылки, линии */
  --color-primary-dark:#2A0949;   /* ховер, подвал */
  --color-primary-light:#F3EEF9;  /* светло-фиолетовая подложка блоков (CTA, выделенные секции) */
  --color-primary-soft:#E5D9F3;   /* светлые линии/бордеры на светло-фиолетовых подложках */
  --color-accent:#EBB81E;         /* жёлтый — дозированный акцент: бейджи, маркеры, подчёркивания */
  --color-bg:#FFFFFF;             /* основной фон */
  --color-text:#161519;           /* почти чёрный — основной текст */
  --color-text-muted:#5C5866;     /* вторичный текст */
  --color-surface:#F7F5FA;        /* подложки секций (лёгкий фиолетовый подтон) */
  --color-border:#E4E1EA;
  --color-success:#1E8A4C;        /* статус «Свободно» (UX §3) */
  --color-warning:#B98900;        /* статус «Резерв» (UX §3) */
  --color-neutral:#6B6B74;        /* статус «Занято» (UX §3) */
  --font-main:"Averta CY","Manrope","Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --logo-url:url("assets/mmprom-logo.png");
  /* Типографика clamp() */
  --fs-h1:clamp(1.75rem,1.2rem + 2.6vw,3rem);
  --fs-h2:clamp(1.4rem,1.1rem + 1.6vw,2.125rem);
  --fs-h3:clamp(1.15rem,1rem + 0.8vw,1.5rem);
  --fs-body:clamp(1rem,0.95rem + 0.25vw,1.0625rem);
  --fs-small:0.875rem;
  /* Прочее */
  --radius:12px;
  --shadow:0 2px 12px rgba(22,21,25,.08);
  --container:1280px;
  --space-section:clamp(48px,8vw,96px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-main);color:var(--color-text);background:var(--color-bg);line-height:1.55;font-size:var(--fs-body)}
img{max-width:100%;display:block}
a{color:var(--color-primary)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:800}
h1{font-size:var(--fs-h1)}
h2{font-size:var(--fs-h2)}
h3{font-size:var(--fs-h3)}
p{margin:0 0 1em}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle}
/* Контейнер */
.container{max-width:var(--container);margin:0 auto;padding:0 16px}
@media (min-width:768px){.container{padding:0 32px}}
@media (min-width:1024px){.container{padding:0 40px}}
.section{padding:var(--space-section) 0}
.section--tint{background:var(--color-surface)}
/* Сеточные хелперы: коллапс 1 → 2 → 3/4 на брейкпоинтах 768/1024 */
.grid{display:grid;gap:16px}
.grid--2,.grid--3,.grid--4{grid-template-columns:1fr}
@media (min-width:768px){
  .grid{gap:24px}
  .grid--2,.grid--3,.grid--4{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1024px){
  .grid--3{grid-template-columns:repeat(3,1fr)}
  .grid--4{grid-template-columns:repeat(4,1fr)}
}
/* Кнопки (touch-target ≥ 44px, CTA-иерархия UX §3) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 24px;border-radius:var(--radius);font-weight:700;font-size:var(--fs-body);text-decoration:none;cursor:pointer;border:2px solid transparent}
.btn--primary{background:var(--color-primary);color:#FFFFFF}
.btn--primary:hover{background:var(--color-primary-dark)}
.btn--accent{background:var(--color-accent);color:var(--color-text)}
.btn--outline{border-color:var(--color-primary);color:var(--color-primary);background:transparent}
.btn--ghost{border-color:var(--color-border);color:var(--color-text);background:#FFFFFF}
/* Статус-бейджи занятости (UX §3) */
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:999px;font-size:var(--fs-small);font-weight:600}
.badge--free{background:rgba(30,138,76,.12);color:var(--color-success)}
.badge--reserve{background:rgba(185,137,0,.14);color:var(--color-warning)}
.badge--busy{background:rgba(107,107,116,.14);color:var(--color-neutral)}
/* Заглушка изображения (объекты без фото) */
.img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--color-surface);border:1px dashed var(--color-border);border-radius:var(--radius);color:var(--color-text-muted);font-size:var(--fs-small);min-height:180px;padding:16px;text-align:center}
.img-placeholder .material-symbols-outlined{font-size:36px;color:var(--color-border)}
/* Шапка — канон видимости (фикс переполнения 2026-09, DESIGN.md §2):
   базово — логотип + бургер; CTA появляется с 768; полное меню с 1024;
   телефон — только с 1200px (на 1024–1199 полное меню + телефон + CTA
   не помещаются в одну строку). Брейкпоинты канона 768/1024 не меняются;
   стили страницы идут позже и могут доопределять внешний вид шапки. */
.site-header__nav{display:none}
.site-header__phone{display:none}
.site-header__cta{display:none}
.site-header__burger{display:inline-flex}
@media (min-width:768px){.site-header__cta{display:inline-flex}}
@media (min-width:1024px){.site-header__nav{display:flex}.site-header__burger{display:none}}
@media (min-width:1200px){.site-header__phone{display:inline-flex}}
/* 1024–1199: компактный CTA шапки — гарантия одной строки при полном меню */
@media (min-width:1024px) and (max-width:1199.98px){.site-header__cta{padding:12px 16px;white-space:nowrap}}
</style>
