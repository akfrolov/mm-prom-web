# Деплой прода на GitHub Pages (mm-prom.ru).
#
# Домен — mm-prom.ru: apex A-записи на IP GitHub Pages, CNAME в корне репо и в
# public/ попадает в dist/. Сайт собирается без `base` (все ссылки/ассеты
# корневые), поэтому проектный URL https://<owner>.github.io/<repo>/ не работает.
# Переменная репозитория ASTRO_SITE переопределяет домен сборки.
# Яндекс.Карты: mm-prom.ru + www + localhost добавить в allowed-domains ОБОИХ
# ключей (ограничения применяются ~15 минут).

name: Deploy production to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://mm-prom.ru' }}
  MMPROM_ENV: prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (prod — canonical/OG, Метрика, robots с Sitemap)
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
